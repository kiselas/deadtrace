schema_version = 1
case_id = "package-exports-next-to-application"
description = "Explicit re-exports of a package are its API even beside an application."

[analysis]
complete = true
worlds = ["production:exports", "production:typer"]
finding_codes = ["RCH001"]
limitation_codes = []

[[targets]]
path = "pkg/core.py"
kind = "function"
qualified_name = "helper"
expectation = "not_candidate"

[[targets]]
path = "pkg/core.py"
kind = "class"
qualified_name = "Client"
expectation = "not_candidate"

[[targets]]
path = "pkg/core.py"
kind = "function"
qualified_name = "Client.send"
expectation = "not_candidate"

[[targets]]
path = "pkg/core.py"
kind = "function"
qualified_name = "dead"
expectation = "candidate"
