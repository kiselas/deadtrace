schema_version = 1
case_id = "unittest-tests-package-init"
description = "Unittest cases in a test package __init__.py are collected."

[analysis]
complete = true
worlds = ["production:library", "production:scripts", "tests:pytest"]
finding_codes = ["RCH001"]
limitation_codes = []

[[targets]]
path = "tests/__init__.py"
kind = "function"
qualified_name = "AuthTest.test_check"
expectation = "not_candidate"

[[targets]]
path = "app/auth.py"
kind = "function"
qualified_name = "check"
expectation = "not_candidate"

[[targets]]
path = "_tool.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"
