schema_version = 1
case_id = "pytest-explicit-test-path"
description = "A file named in a pytest command is collected whatever python_files says."

[analysis]
complete = true
worlds = ["production:library", "production:scripts", "tests:pytest"]
finding_codes = ["RCH001"]
limitation_codes = []

[[targets]]
path = "_checks.py"
kind = "function"
qualified_name = "test_price"
expectation = "not_candidate"

[[targets]]
path = "_checks.py"
kind = "class"
qualified_name = "TestPrice"
expectation = "not_candidate"

[[targets]]
path = "app/pricing.py"
kind = "function"
qualified_name = "price"
expectation = "not_candidate"

[[targets]]
path = "_tool.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"
