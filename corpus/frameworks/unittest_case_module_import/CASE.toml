schema_version = 1
case_id = "unittest-case-module-import"
description = "A TestCase imported from unittest.case is a unittest case that pytest collects."

[analysis]
complete = true
worlds = ["production:library", "production:scripts", "tests:pytest"]
finding_codes = ["RCH001", "RCH004"]
limitation_codes = ["DT2002"]

[[targets]]
path = "tests/test_auth.py"
kind = "function"
qualified_name = "AuthTests.test_check"
expectation = "not_candidate"

[[targets]]
path = "app/_auth.py"
kind = "function"
qualified_name = "check"
expectation = "test_only"

[[targets]]
path = "_tool.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"
