schema_version = 1
case_id = "pytest-explicit-path-in-workflow"
description = "A test file named by a pytest step of a GitHub workflow is collected."

[analysis]
complete = true
worlds = ["production:library", "production:scripts", "tests:pytest"]
finding_codes = ["RCH001"]
limitation_codes = []

[[targets]]
path = "checks.py"
kind = "function"
qualified_name = "test_price"
expectation = "not_candidate"

[[targets]]
path = "app/pricing.py"
kind = "function"
qualified_name = "price"
expectation = "not_candidate"

[[targets]]
path = "_tool.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"
