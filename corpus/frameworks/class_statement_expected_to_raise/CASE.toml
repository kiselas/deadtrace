schema_version = 1
case_id = "class-statement-expected-to-raise"
description = "A class statement inside pytest.raises is the behaviour under test."

[analysis]
complete = true
worlds = ["production:library", "production:scripts", "tests:pytest"]
finding_codes = ["RCH001"]
