[[targets]]
path = "tests/test_setup.py"
kind = "class"
qualified_name = "test_invalid._Invalid"
expectation = "not_candidate"

[[targets]]
path = "tests/test_setup.py"
kind = "class"
qualified_name = "test_other._Unused"
expectation = "candidate"
