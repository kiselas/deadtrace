schema_version = 1
case_id = "pytest-separation"
description = "Fixture reachability does not leak into the production world."

[analysis]
complete = true
worlds = ["production:web", "tests:pytest"]
finding_codes = ["RCH001", "RCH004"]
limitation_codes = []

[[targets]]
path = "app.py"
kind = "function"
qualified_name = "test_only_helper"
expectation = "test_only"

[[targets]]
path = "app.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"

[[targets]]
path = "tests/conftest.py"
kind = "function"
qualified_name = "value"
expectation = "test_live"
