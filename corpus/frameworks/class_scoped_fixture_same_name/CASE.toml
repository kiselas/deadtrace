schema_version = 1
case_id = "class-scoped-fixture-same-name"
description = "A class fixture shadows a same-named fixture of another class in the module."

[analysis]
complete = true
worlds = ["production:scripts", "tests:pytest"]
finding_codes = ["RCH001"]
limitation_codes = []

[[targets]]
path = "tests/test_values.py"
kind = "function"
qualified_name = "make_first"
expectation = "not_candidate"

[[targets]]
path = "tests/test_values.py"
kind = "function"
qualified_name = "make_second"
expectation = "not_candidate"

[[targets]]
path = "_tool.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"
