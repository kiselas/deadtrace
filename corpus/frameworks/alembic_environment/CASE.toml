kind = "function"
qualified_name = "upgrade"
expectation = "not_candidate"

[[targets]]
path = "app/alembic/versions/0001_initial.py"
kind = "function"
qualified_name = "downgrade"
expectation = "not_candidate"

[[targets]]
path = "app/alembic/versions/0001_initial.py"
kind = "function"
qualified_name = "unused_helper"
expectation = "candidate"
