[project]
name = "deadtrace-reference-fastapi-dishka"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "dishka==1.10.1",
  "fastapi==0.141.1",
]

[tool.deadtrace]
require-complete = true

[[tool.deadtrace.worlds]]
profile = "production"
scenario = "web"
roots = ["app.main:app"]
frameworks = ["python", "fastapi", "dishka"]
