schema_version = 1
case_id = "metaclass-method-on-built-class"
description = "A metaclass method calls members of the class built with it through its first parameter."

[analysis]
complete = true
worlds = ["production:library", "production:scripts"]
finding_codes = ["RCH001"]
limitation_codes = ["DT2002"]

[[targets]]
path = "app/_types.py"
kind = "function"
qualified_name = "NumberType._lookups"
expectation = "protected"

[[targets]]
path = "app/_types.py"
kind = "function"
qualified_name = "BaseType._lookups"
expectation = "protected"

[[targets]]
path = "app/_types.py"
kind = "function"
qualified_name = "NumberType._unused"
expectation = "candidate"
