schema_version = 1
case_id = "module-getattr-hook"
description = "Module-level __getattr__ and __dir__ are called by Python."

[analysis]
complete = true
worlds = ["production:scripts"]
finding_codes = ["RCH001"]
limitation_codes = ["DT2002"]

[[targets]]
path = "_compat.py"
kind = "function"
qualified_name = "__getattr__"
expectation = "not_candidate"

[[targets]]
path = "_compat.py"
kind = "function"
qualified_name = "__dir__"
expectation = "not_candidate"

[[targets]]
path = "_compat.py"
kind = "function"
qualified_name = "unused"
expectation = "candidate"
